name: mcp-inspector

# v1.0.3 — MCP 서버를 **실제로 띄워** tool 목록을 받고, 커밋된 descriptor 와 대조한다.
#
# 층이 둘이다:
#   - smoke 의 `check_mcp_tool_descriptors.py` — 커밋된 산출물이 MCP 스펙 모양인가
#     (의존성 없이, Python 으로)
#   - 이 워크플로우 — 서버가 그 descriptor 를 **실제로 그대로 노출하는가**
#
# 두 층은 서로를 대신하지 못한다. 파일이 스펙에 맞아도 서버가 다른 것을 내보낼 수
# 있고, 그 반대도 마찬가지다. 이번 사이클에 mkdocs 에서 정확히 그 구분을 놓쳐
# `hooks:` 가 "로드되는가"와 "일하는가"로 갈렸고, mypy 에서는 "선언했는가"와
# "실제로 그 설정으로 쟀는가"로 갈렸다.
#
# 공식 도구: https://github.com/modelcontextprotocol/inspector (CLI 모드, Node 필요)

on:
  push:
    branches: [main]
    paths:
      - 'workflow-source/workflow_kit/server/**'
      - 'workflow-source/schemas/read_only_transport_descriptors.json'
      - '.github/workflows/mcp-inspector.yml'
  pull_request:
    branches: [main]
    paths:
      - 'workflow-source/workflow_kit/server/**'
      - 'workflow-source/schemas/read_only_transport_descriptors.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: tools/list ↔ committed descriptors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          # Inspector 는 Node ^22.7.5 이상을 요구한다.
          node-version: '22'

      - name: Install workflow_kit + MCP SDK
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          python3 -m pip install --upgrade pip || rc=$?
          python3 -m pip install -e "./workflow-source[mcp-sdk]" || rc=$?
          exit "$rc"

      - name: "집힌 mcp 버전 기록 (정책: floating)"
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-source
        run: |
          set -uo pipefail
          # Python 쪽은 상한 없이 최신, Node 쪽 인스펙터는 `@2` 로 고정이다 (§2.42).
          # 둘 다 "도구도 의존성" 이라 어느 버전으로 쟀는지가 결과의 일부다.
          # 정본: workflow-source/workflow_kit/common/sdk_matrix.py
          python3 -m workflow_kit.common.sdk_matrix --record mcp-inspector | tee -a "$GITHUB_STEP_SUMMARY"

      - name: List tools via MCP Inspector (CLI)
        shell: bash
        run: |
          set -uo pipefail
          rc=0

          # Inspector 2.0.0 은 `--cli <command> <args...>` 의 **args 를 삼킨다**.
          # 예전 호출(`--cli python3 -m … --stdio-sdk --method tools/list`)은 서버를
          # **인자 0개**로 띄웠고 (argv 로깅 wrapper 로 실측: ARGC=0), 맨 python3 가
          # REPL 로 떠서 JSON-RPC 를 Python 소스로 실행해 이렇게 죽었다:
          #   NameError: name 'true' is not defined
          # 그 다음 클라이언트가 15초 뒤 timeout 낸 것이 표면 증상이었다 — 원인에서
          # 두 칸 떨어진 메시지다.
          #
          # 그래서 명령을 위치 인자로 넘기지 않고 **config 로 선언**한다. 이 경로는
          # inspector 2.0.0 에서 tools/list 왕복까지 실측했다.
          cat > inspector-config.json <<JSON
          {
            "mcpServers": {
              "read-only-bundle": {
                "command": "python3",
                "args": ["-m", "workflow_kit.server.read_only_mcp_sdk", "--stdio-sdk"],
                "env": { "PYTHONPATH": "${{ github.workspace }}/workflow-source" }
              }
            }
          }
          JSON

          # 버전 고정. `npx -y <pkg>` 는 항상 최신을 집는다 — 이 저장소는 같은 날
          # Python `mcp` 가 상한 없이 2.0.0 으로 넘어가 CI 를 red 로 만든 것을 이미
          # 겪었다 (릴리스 노트 §2.41). 도구도 의존성이다.
          # 올릴 때는 이 호출이 그 버전에서도 도는지 먼저 확인할 것.
          npx -y @modelcontextprotocol/inspector@2 --cli \
            --config inspector-config.json \
            --server read-only-bundle \
            --method tools/list > live-tools.json 2> inspector-err.txt || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Inspector 가 서버에서 tool 목록을 받지 못했다 (exit $rc)"
            cat inspector-err.txt
            exit "$rc"
          fi

          # rc=0 인데 내용이 비어 있는 경우를 통과시키지 않는다 — 위 사고에서
          # 배운 것은 "죽지 않았다" 가 "받았다" 가 아니라는 것이다.
          python3 - <<'PY' || rc=$?
          import json, pathlib, sys
          tools = json.loads(pathlib.Path("live-tools.json").read_text()).get("tools")
          if not tools:
              print("::error::live-tools.json 에 tool 이 없다 — 서버가 떴지만 목록이 비었다")
              sys.exit(1)
          print(f"받은 tool: {len(tools)}개")
          PY
          exit "$rc"

      - name: Compare against committed descriptors
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          python3 - <<'PY' || rc=$?
          import json, pathlib, sys

          live = json.loads(pathlib.Path("live-tools.json").read_text())["tools"]
          committed = json.loads(
              pathlib.Path("workflow-source/schemas/read_only_transport_descriptors.json")
              .read_text()
          )["tools"]

          ln = {t["name"] for t in live}
          cn = {t["name"] for t in committed}
          problems = []
          if ln - cn:
              problems.append(f"서버에만 있는 tool: {sorted(ln - cn)}")
          if cn - ln:
              problems.append(f"descriptor 에만 있는 tool: {sorted(cn - ln)}")
          for name in sorted(ln & cn):
              a = next(t for t in live if t["name"] == name).get("inputSchema")
              b = next(t for t in committed if t["name"] == name).get("inputSchema")
              if a != b:
                  problems.append(f"{name}: inputSchema 불일치")

          print(f"서버 {len(ln)}개 / descriptor {len(cn)}개")
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          PY
          if [ "$rc" -ne 0 ]; then
            echo "::error::살아 있는 서버와 커밋된 descriptor 가 갈렸다 — 둘 중 하나가 stale 하다."
          fi
          exit "$rc"

      - name: Upload live tool list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-live-tools
          path: |
            live-tools.json
            inspector-err.txt
          retention-days: 30
          if-no-files-found: ignore
