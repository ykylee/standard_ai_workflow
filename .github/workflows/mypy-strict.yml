name: mypy-strict

# v0.11.11 follow-up: v0.11.10 의 "다음" §1 — full mypy strict 도달 후 CI 통합.
# v0.11.10 = mypy workflow_kit/ exit 0 (106 source files strict clean).
# v0.11.11 = mypy exit 0 을 CI 강제 (regression 방지).
# memory #8: 1 release = 1 follow-up. v0.11.10 의 누적 35 file strict clean 유지 verify.
#
# Triggers: push to main + pull_request to main (smoke / mkdocs 와 정합한 main-only 정책)
# Python: 3.10 (workflow_kit python_version 정합)
# Mypy: 2.1.0 (v0.11.10 release note 의 strict 기준 정합)
#
# Mypy invocation: `mypy --no-incremental --config-file workflow-source/pyproject.toml
#                   workflow-source/workflow_kit/`
#
# v1.0.2 — **이 워크플로우는 v0.11.11 이래 strict 로 돈 적이 없다.** 이전 주석은
# "workflow-source/ 의 pyproject [tool.mypy] strict=true read" 라고 적고 있었지만
# 사실이 아니었다. mypy 의 config 탐색은 *cwd 기준* 으로
#   ./mypy.ini → ./.mypy.ini → ./pyproject.toml ([tool.mypy] 가 있을 때만) → ./setup.cfg
# 순인데, 이 job 의 cwd 는 REPO_ROOT 이고 루트 pyproject.toml 은 v0.15.0+ 의 의도된
# root-level placeholder scaffold (`eb62f37`) 라
# [tool.mypy] 섹션이 없다. 그래서 전부 건너뛰고 `Config File: Default` 로 떨어졌다
# (`mypy -v` 의 "Config File:" 줄로 확인). 결과: 설정 없이 117 file 0 error → green.
# 선언된 strict 를 물리면 4 errors 였다.
#
# 부수적으로 v0.11.11 릴리스 노트의 인과 설명도 틀렸다 — mypy 는 config 를 **merge 하지
# 않는다**. 정확히 하나만 고른다. "sub-package config 와의 merge 회피" 라고 적힌 조치는
# 실제로는 *설정을 통째로 잃는* 조치였고, 46 → 0 은 코드가 좋아져서가 아니라 검사를
# 안 하게 돼서였다.
#
# 재발 방지: cwd 에 의존하는 암묵적 탐색을 쓰지 말고 `--config-file` 로 명시한다.
# `workflow-source/tests/check_mypy_config_actually_loaded.py` 가 세 호출 지점(CI /
# release gate / smoke)이 모두 명시하고 있는지 + 실제로 그 파일이 로드되는지 검사한다.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:  # manual trigger

jobs:
  mypy-strict:
    name: mypy strict (workflow_kit/)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install mypy 2.1.0 + workflow_kit (pydantic, anyio, mcp-sdk 포함)
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          # v0.11.10 release note 기준 mypy 2.1.0 strict 정합
          python3 -m pip install "mypy==2.1.0"
          # workflow_kit 의 runtime dep (pydantic, anyio) + optional mcp-sdk
          # extra (mcp_v1_server.py 의 mcp.server.fastmcp import resolve).
          # editable install — mypy 가 third-party type stub 해결 가능.
          # v0.11.18 in-scope fix: mcp-sdk extra 추가 — CI 의 mypy strict 가
          # local 과 동일 baseline 으로 동작하도록.
          #
          # v1.0.2: 설치 대상을 sub-package → **정본 배포판** 으로 교정.
          # `./workflow-source/workflow_kit` 은 배포판으로서 깨져 있었다 —
          # `packages = ["common","server","harness"]` 라 wheel 은 최상위에
          # common/server/harness 만 싣고 (117 중 51 file) `workflow_kit` 패키지
          # 자체가 없으며, editable 로는 server/harness 만 올라와 `import workflow_kit`
          # 이 실패한다. 이 job 이 지금껏 돈 것은 mypy 에 target 을 *경로* 로 주기
          # 때문이고, 그 설치 줄은 사실상 third-party 의존성만 가져오고 있었다.
          # 해당 pyproject 는 v1.0.2 에서 제거하고 workflow-source 로 단일화했다.
          python3 -m pip install -e "./workflow-source[mcp-sdk]"

      - name: "집힌 mcp 버전 기록 (정책: floating)"
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-source
        run: |
          set -uo pipefail
          # 이 job 은 상한 없는 extra 로 **최신**을 집는다. 그래서 mcp 2.0.0 을
          # 처음 물어 온 것도 여기다 (§2.41) — 부동을 없애면 그 조기 경보를 잃는다.
          # 대신 집힌 값을 첫 화면에 남긴다. "코드는 안 바뀌었는데 결과가 바뀌었다" 의
          # 답이 설치 로그를 뒤져야 나오면, 그 답은 없는 것과 같다.
          # 정본: workflow-source/workflow_kit/common/sdk_matrix.py
          python3 -m workflow_kit.common.sdk_matrix --record mypy-strict | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run mypy --no-incremental workflow_kit/
        shell: bash
        run: |
          set -uo pipefail
          # REPO_ROOT 에서 실행. v1.0.2: config 를 **명시**한다 — 암묵적 cwd 탐색은
          # 루트 pyproject.toml 에 [tool.mypy] 가 없어 Default 로 떨어졌다 (헤더 주석 참조).
          #
          # `-v` 로 한 번만 돌리고 출력을 갈라 쓴다. 어떤 config 를 물었는지 로그에 남기는
          # 것이 핵심이다 — 조용히 Default 로 떨어지는 것이 이 결함이 안 보인 이유였다.
          OUT="${RUNNER_TEMP:-/tmp}/mypy-out.txt"
          rc=0
          mypy -v --no-incremental \
            --config-file workflow-source/pyproject.toml \
            workflow-source/workflow_kit/ > "$OUT" 2>&1 || rc=$?

          # §2.27 교훈: `set -e` 는 러너가 non-zero 로 끝나는 순간 다음 줄에 닿기도 전에
          # 스텝을 중단시킨다. 요약 블록이 실패 시 한 번도 실행되지 않는 사고가 있었다.
          CONFIG_LINE="$(grep -E '^LOG:  Config File:' "$OUT" || true)"
          echo "${CONFIG_LINE:-'⚠ Config File 줄 없음 — mypy -v 출력 형식 변경?'}"
          grep -vE '^LOG:' "$OUT" || true

          EXPECTED="workflow-source/pyproject.toml"
          case "$CONFIG_LINE" in
            *"$EXPECTED"*) ;;
            *)
              echo "::error::mypy 가 $EXPECTED 를 로드하지 않았다 — strict 가 적용되지 않은 상태다. ($CONFIG_LINE)"
              exit 1
              ;;
          esac
          exit $rc
