name: okf-validate

# OKF sample bundle validation (ADR-006/008/010/012/013/026)
# 버전은 여기 적지 않는다 — `okf_export.OKF_SPEC_VERSION` 이 정본이다.
# V-R10 URL validity lint with --online (HEAD) + --cache (24h disk cache)
# GITHUB_TOKEN 자동 사용 (rate limit 5000 req/h, unauth 60 req/h)

on:
  push:
    branches: ["main"]
    paths:
      - "ai-workflow/wiki/**"
      - "docs/samples/okf-bundle-2026-06-16/**"
      - "workflow-source/workflow_kit/url_validity.py"
      - "workflow-source/workflow_kit/okf_export.py"
      # v1.0.4(§2.58): 추출기가 이 모듈로 옮겨졌다. 소비자를 트리거하는 목록에
      # 넣지 않으면, 추출 규약이 바뀌어도 유일한 소비자가 안 돈다.
      - "workflow-source/workflow_kit/frontmatter_urls.py"
      - ".github/workflows/okf-validate.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ai-workflow/wiki/**"
      - "docs/samples/okf-bundle-2026-06-16/**"
  schedule:
    # weekly cron (Sunday 03:00 UTC = ~KR 시간 12:00 낮)
    - cron: "0 3 * * 0"
  workflow_dispatch:  # manual trigger

jobs:
  okf-online-validation:
    name: V-R10 online URL validation (with cache)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore URL validity cache (cross-PR via GHA cache, ADR-016)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/url_validity_cache
          key: v-r10-url-cache-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            v-r10-url-cache-${{ github.repository }}-${{ github.ref_name }}-
            v-r10-url-cache-${{ github.repository }}-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # workflow_kit 은 stdlib only — no extra deps
          python3 -c "import urllib.request; print('urllib OK')"

      - name: Extract URLs from frontmatter (resource, last_ingested_from)
        id: extract
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-source
        run: |
          set -euo pipefail
          # v1.0.4(§2.58): grep 한 줄이던 추출기를 모듈로 옮겼다. 그 grep 은
          #   (1) frontmatter 가 아니라 파일 전체를 훑어 *산문 속 예시* 를 URL 로 뽑았고
          #       (`…README.md`).` — 죽은 링크가 아니라 태어난 적 없는 링크),
          #   (2) 값을 공백에서 끊어 `a + b` 형태의 두 번째 출처를 조용히 버렸다.
          # 추출 규약을 아는 자리는 이제 workflow_kit.frontmatter_urls 하나다.
          urls_file="$RUNNER_TEMP/urls.txt"
          roots=(ai-workflow/wiki docs/samples/okf-bundle-2026-06-16)
          python3 -m workflow_kit.frontmatter_urls "${roots[@]}" \
            --format urls --relative-to . > "$urls_file"
          url_count=$(wc -l < "$urls_file")
          echo "url_count=$url_count" >> "$GITHUB_OUTPUT"
          echo "Extracted $url_count unique URLs"
          # 출처(파일:줄)를 로그에 남긴다 — URL 문자열만 남기면 실패했을 때 어느
          # 파일에서 왔는지 손으로 찾아야 한다 (이번 조사가 그랬다).
          echo "::group::URL provenance (file:line key url)"
          python3 -m workflow_kit.frontmatter_urls "${roots[@]}" \
            --format text --relative-to .
          echo "::endgroup::"

      - name: "V-R10 규약: `resource` 는 bare URI 여야 한다"
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-source
        run: |
          set -uo pipefail
          # 데이터만 고치면 다음에 같은 값이 다시 들어오고, 추출기만 고치면 그 값이
          # 규약 위반인 채로 남는다. 규약을 검사로 고정한다 (§2.58).
          # 스캔 대상이 0건이면 exit 2 — "위반 0건" 과 "안 봤음" 을 가른다.
          python3 -m workflow_kit.frontmatter_urls \
            ai-workflow/wiki docs/samples/okf-bundle-2026-06-16 \
            --check --format text --relative-to .

      - name: V-R10 offline + online + cache (24h)
        if: steps.extract.outputs.url_count > 0
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-source
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          urls_file="$RUNNER_TEMP/urls.txt"
          cache_dir="$RUNNER_TEMP/url_validity_cache"
          mkdir -p "$cache_dir"
          failed=0
          echo "::group::V-R10 offline + online + cache validation"
          # Build CLI args file
          args_file="$RUNNER_TEMP/args.txt"
          : > "$args_file"
          while IFS= read -r url; do
            [ -n "$url" ] && echo "$url" >> "$args_file"
          done < "$urls_file"
          xargs -a "$args_file" python3 -m workflow_kit.url_validity \
            --mode=strict --online --cache --body \
            --ttl 86400 --timeout 10 --max-retries 3 \
            | tee "$RUNNER_TEMP/okf-validate.log"
          rc=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            echo "::error::V-R10 online validation found issues (exit $rc)"
            failed=1
          fi

          # cache stats
          echo "::group::Cache stats"
          python3 -m workflow_kit.url_validity --cache-stats
          echo "::endgroup::"

          # post summary
          {
            echo "## V-R10 Online Validation"
            echo
            echo "- URLs checked: $(wc -l < "$urls_file")"
            echo "- Cache: 24h TTL at \`$cache_dir\`"
            echo "- Mode: strict + online + cache"
            if [ "$failed" -ne 0 ]; then
              echo "- Result: ❌ FAIL"
            else
              echo "- Result: ✅ PASS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: V-R10 v0.7.36 cache clear (cleanup)
        if: always()
        shell: bash
        run: |
          # CI cache cleanup (PR마다 fresh cache 유지)
          rm -rf "$RUNNER_TEMP/url_validity_cache" || true
          echo "Cache cleaned up"

  okf-export-smoke:
    name: OKF export + 5-page PoC re-export
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: OKF export smoke (5 pages, strict mode)
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-source
        run: |
          set -euo pipefail
          out="/tmp/okf_poc"
          rm -rf "$out"
          python3 -m workflow_kit.okf_export \
            --wiki ai-workflow/wiki \
            --out "$out" \
            --vcs-commit "$GITHUB_SHA" \
            --include okf-open-knowledge-format \
            --include adr-001-3-layer-separation \
            --include workflow-kit \
            --include r4-anchor-index \
            --include wiki-source-rule-r9
          # 기대 버전은 **정본에서 파생한다**. 리터럴('0.1')이었을 때,
          # exporter 를 0.2 로 올린 순간 이 스텝이 red 가 됐다 — export 는
          # 내내 옳았고 틀린 것은 검사였다 (TASK-2026-08-20-main-016).
          # 검사가 리터럴로 든 기대값은 계약이 아니라 그 시점 상수다.
          expected="$(python3 -c 'from workflow_kit.okf_export import OKF_SPEC_VERSION; print(OKF_SPEC_VERSION)')"
          actual="$(sed -n 's/^okf_version: "\(.*\)"$/\1/p' "$out/index.md" | head -1)"
          if [ -z "$actual" ]; then
            echo "::error::bundle root index.md has no okf_version field"
            exit 1
          fi
          # 없음과 어긋남을 갈라서 말한다. 예전 메시지는 둘 다 "missing" 이라
          # 불러서, 실제로는 값이 **달랐을 뿐**인데 필드가 없다고 보고했다.
          if [ "$actual" != "$expected" ]; then
            echo "::error::bundle root index.md okf_version=$actual but OKF_SPEC_VERSION=$expected"
            exit 1
          fi
          echo "OKF export smoke PASS (okf_version=$actual)"
      - name: OKF export unit tests (10/10)
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-source
        run: |
          python3 workflow-source/tests/check_okf_export.py
