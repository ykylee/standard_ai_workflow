name: os-matrix

# CLI cross-platform 지원 (TASK-2026-08-12-main-005).
#
# 전량 smoke 251개는 Linux CI (+ darwin homelab 수동 실측) 축만 있었다 — Windows 는
# 로컬에 없는 축이라 아무도 잰 적이 없다 (darwin /private symlink 4건과 같은 계열).
# 이 워크플로우가 그 축이다: windows-latest / macos-latest 에서 kit 을 pip 로
# 설치하고 **소비자 표면** (wk 핵심 명령 + MCP 브리지 기동) 을 실측한다.
#
# 지원 tier (INSTALLATION_AND_USAGE.md §2 와 정합):
#   - Linux  : 전량 smoke (smoke.yml, 2 브랜치 컨텍스트)
#   - macOS  : 본 probe (CI) + 전량 2축 (darwin homelab 수동, 2026-08-11 실측)
#   - Windows: 본 probe (CI) — 전량 smoke 이식은 별건
#
# PYTHONUTF8=1: Windows 콘솔 기본 인코딩(cp125x)에서 한국어 출력이 죽는 것을 막는다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cli-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kit (consumer path — non-editable)
        run: python -m pip install ./workflow-source
      - name: Run cross-platform CLI probe
        run: python workflow-source/scripts/cross_platform_cli_probe.py
