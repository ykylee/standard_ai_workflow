name: smoke

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  prepare:
    name: 선언된 매트릭스 (브랜치 × 해석기)
    runs-on: ubuntu-latest
    outputs:
      contexts: ${{ steps.registry.outputs.contexts }}
      interpreters: ${{ steps.registry.outputs.interpreters }}
      python_floor: ${{ steps.registry.outputs.python_floor }}
    steps:
      - uses: actions/checkout@v4

      # v1.9.5(TASK-2026-09-21-main-006): **setup-python 을 쓰지 않는다.**
      # 이 job 은 stdlib 만 쓰는 registry 둘을 읽을 뿐이고, 여기에
      # `python-version:` 을 적으면 해석기 정본의 **사본**이 하나 생긴다. 러너
      # 기본 python3 로 족하다 (registry 는 의존성도 설치도 필요 없다).
      - name: Read branch + interpreter matrix from registry
        id: registry
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-source
        run: |
          set -uo pipefail
          # 설치가 필요 없다 — registry 는 stdlib 만 쓴다 (mcp-sdk-matrix 와 같은 패턴).
          CONTEXTS="$(python3 -m workflow_kit.common.branch_matrix --github-matrix)"
          INTERPRETERS="$(python3 -m workflow_kit.common.interpreter_matrix --github-matrix)"
          # v1.10.1(TASK-2026-09-22-main-007): 하한도 **선언에서** 파생한다.
          # yml 에 `3.10` 을 적으면 `requires-python` 의 사본이 하나 생긴다 —
          # 해석기·브랜치 매트릭스가 registry→yml 로 세운 규율과 같은 자리다.
          FLOOR="$(python3 -m workflow_kit.common.python_floor --declared-floor)"
          # 셋을 한 블록으로 묶는다 — 연속 append 는 shellcheck SC2129 다
          # (actionlint 가 CI 에서 잡았다; 로컬에는 actionlint 가 없어 못 봤다).
          {
            echo "contexts=${CONTEXTS}"
            echo "interpreters=${INTERPRETERS}"
            echo "python_floor=${FLOOR}"
          } >> "$GITHUB_OUTPUT"
          echo "선언 하한(requires-python): ${FLOOR}"
          echo "선언된 브랜치 컨텍스트: ${CONTEXTS}"
          echo "선언된 해석기: ${INTERPRETERS}"
          {
            echo "## 브랜치 컨텍스트 (정본: \`workflow_kit/common/branch_matrix.py\`)"
            echo
            python3 -m workflow_kit.common.branch_matrix --summary
            echo
            echo "## 해석기 (정본: \`workflow_kit/common/interpreter_matrix.py\`)"
            echo
            python3 -m workflow_kit.common.interpreter_matrix --summary
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Run smoke tests (${{ matrix.branch_context.label }} / py${{ matrix.python }})
    needs: prepare
    runs-on: ubuntu-latest
    # v1.0.9(§2.56): **브랜치 컨텍스트를 2셀로 돌린다.**
    #
    # 이 workflow 는 `branches: ["**"]` 라 모든 브랜치에서 돌지만, 실제 개발이 거의
    # main 에서 이뤄지므로 **슬래시가 들어간 브랜치를 밟는 실행은 아무도 보장하지
    # 않았다**. 그래서 §2.55 의 결함 3건이 오래 살아 있었다 — 슬래시 브랜치는
    # `active/feature/x/` 라는 *중첩* 디렉터리가 되어 경로 깊이와 이름 파싱이 전부
    # 달라지는데, main 에서 재면 그 차이가 0이다.
    #
    # **"branch-sensitive 한 검사 목록" 을 선언해서 그것만 돌리지 않는다.** 그 목록은
    # 반드시 드리프트하고, 빠진 것을 셀 방법이 없다(§2.53 에서 같은 모양의 포함 목록을
    # 없앴다). 전량을 두 컨텍스트로 돌린다 — 두 셀은 병렬이라 wall-clock 은 그대로다.
    #
    # v1.1.7(TASK-017): **셀 목록을 여기 적지 않는다.** 정본은
    # `workflow_kit/common/branch_matrix.py` 이고 위 prepare job 이 주입한다.
    # 이유는 재현 수단의 비대칭이었다 — CI 는 두 컨텍스트를 돌고 로컬 전량 검사는
    # native 하나만 돌아, TASK-016 의 결함이 15연속 red 인 동안 로컬은 계속 green
    # 이었다. 이제 로컬도 같은 정본을 읽는다:
    #     python3 workflow-source/tests/run_all_checks.py --branch-context=all
    #
    # 오버라이드 키도 정본(`BRANCH_ENV_KEYS[0]` = `CODEX_WORKFLOW_BRANCH`)에서 온다.
    # `GITHUB_REF_NAME` 을 덮으면 러너의 실제 컨텍스트까지 바뀌므로 쓰지 않는다.
    #
    # v1.9.5(TASK-2026-09-21-main-006): **해석기 축을 곱한다.** 셀이 2 → 4 다.
    #
    # 착수 시점 실측: CI 는 검사를 3.11 하나로만 돌았고, 3.13 커버리지는 개발자
    # `.venv` 에 깔린 것 — 즉 **선언이 아니라 우연** 이었다. 두 방향 모두 실제로
    # 갈라져 있었다:
    #   · 3.13 green / 3.11 red — `check_python_floor_syntax` case 3 (9915e4ad)
    #   · 3.11 침묵 / 3.13 경고 — invalid escape sequence(3.12+ SyntaxWarning)를
    #     5개 검사가 3.13 에서만 보고 있었다. CI 는 그 부류를 통째로 못 봤다.
    # 전량 2축 대조 실측(2026-09-21): 287/287 × 2 green, 출력 갈림 8건.
    #
    # "해석기 민감 검사 목록" 을 선언해 그것만 돌리지 않는다 — 위 브랜치 축과 같은
    # 이유이고, 실측에서 민감한 쪽은 *저장소 소스를 파싱하는 검사* 라 미리 알 수 없다.
    # 셀은 병렬이라 wall-clock 은 그대로다. 버전 목록의 정본은
    # `workflow_kit/common/interpreter_matrix.py` 이고 prepare job 이 주입한다.
    strategy:
      fail-fast: false
      matrix:
        branch_context: ${{ fromJSON(needs.prepare.outputs.contexts) }}
        python: ${{ fromJSON(needs.prepare.outputs.interpreters) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # **하한 해석기를 먼저 깐다** (TASK-2026-09-22-main-007).
      #
      # 이것이 없으면 `check_python_floor_syntax` case 2 가 `feature_version`
      # 부분 측정으로 떨어지고, 그 수단은 **PEP 701(중첩 f-string)을 못 본다** —
      # 이 축을 만들게 한 바로 그 결함이다. 검사는 그 사실을 `[unmeasured]` 로
      # 정직하게 말하고 있었고, 여기서 그 칸을 측정으로 옮긴다.
      #
      # **순서가 계약이다.** `setup-python` 은 PATH 앞에 붙으므로 **나중에 깐 것이
      # `python3` 을 차지한다.** 하한을 먼저 깔아야 이 셀이 선언한 해석기로 돌고
      # (`--assert-running` 이 그것을 단언한다), `python3.10` 은 이름으로 여전히
      # 찾을 수 있다 — `python_floor.find_interpreter` 가 그 이름을 본다.
      - name: Set up floor Python (선언 파생)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.prepare.outputs.python_floor }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 이 셀이 선언한 해석기로 도는가
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-source
        run: |
          set -uo pipefail
          # setup-python 이 선언대로 깔렸다고 믿지 않는다. 셀이 다른 버전으로 돌면
          # "두 해석기를 밟았다" 는 보고가 거짓이 되는데 아무것도 실패하지 않는다
          # (브랜치 축이 `RESOLVED != OVERRIDE` 로 막는 것과 같은 자리).
          #
          # **파이프에 넣지 않는다.** 이 저장소는 `검증 | tail` 이 종료 코드를
          # 덮어 게이트를 무력화한 일을 두 번 겪었다 — 파일로 받고 코드를 따로 읽는다.
          rc=0
          python3 -m workflow_kit.common.interpreter_matrix \
            --assert-running "${{ matrix.python }}" > interpreter-probe.txt || rc=$?
          cat interpreter-probe.txt >> "$GITHUB_STEP_SUMMARY"
          cat interpreter-probe.txt
          exit "$rc"

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-dev.txt
          # v1.0.1: smoke 가 실제로 요구하는 도구를 설치한다.
          #
          # `dev` (mypy) 와 `release` (build, twine) extra 는 pyproject 에 이미
          # 선언돼 있었는데 (§2.14), CI 는 requirements-dev.txt 만 깔았고 그 파일은
          # `mcp[cli]` 한 줄뿐이었다. 그래서 mypy / build / twine 을 subprocess 로
          # 부르는 check 들이 CI 에서만 red 였다 — 선언은 했는데 설치를 안 했다.
          #
          # editable install 은 `bootstrap_lib` 도 sys.path 에 올려
          # check_bootstrap_interactive_picker 의 ModuleNotFoundError 도 함께 푼다.
          #
          # 실측: 이 한 줄로 CI 실패 11건 중 7건이 해소된다 (fresh venv 재현 확인).
          python3 -m pip install -e "./workflow-source[dev,release,mcp-sdk]"

      - name: "집힌 mcp 버전 기록 (정책: pinned floor)"
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-source
        run: |
          set -uo pipefail
          # 이 job 이 1.x 로 도는 것은 위 세 줄의 **설치 순서** 때문이다
          # (`requirements-dev.txt` 의 핀이 editable install 뒤에 깔려 되돌린다).
          # 그 사실을 registry 에 정책으로 적어 두고 여기서 강제한다 — 핀이 사라지면
          # 커버리지가 조용히 없어지는 대신 이 스텝이 실패한다.
          # 정본: workflow-source/workflow_kit/common/sdk_matrix.py
          python3 -m workflow_kit.common.sdk_matrix --record smoke | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run smoke checks (run_all_checks + resource guard)
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/workflow-source
          WORKFLOW_BRANCH_OVERRIDE: ${{ matrix.branch_context.workflow_branch }}
        run: |
          set -uo pipefail
          # v1.0.9(§2.56): 슬래시 셀만 workflow 메모리 브랜치를 덮는다. **비어 있으면
          # export 하지 않는다** — 빈 값을 넣으면 `_usable_branch_name` 이 None 을 내고
          # 다음 env 키로 흘러가, "native 를 쟀다" 와 "빈 값이라 흘렀다" 가 같은 모양이 된다.
          if [ -n "${WORKFLOW_BRANCH_OVERRIDE}" ]; then
            export CODEX_WORKFLOW_BRANCH="${WORKFLOW_BRANCH_OVERRIDE}"
          fi
          # 무엇을 기준으로 쟀는지 먼저 남긴다 — 두 셀의 요약이 똑같아 보이면
          # 어느 쪽이 통과한 것인지 알 수 없다.
          RESOLVED="$(python3 -c 'from workflow_kit.common.paths import get_current_branch; print(get_current_branch())')"
          {
            echo "## 셀: 브랜치 \`${{ matrix.branch_context.label }}\` × Python \`${{ matrix.python }}\`"
            echo
            echo "- 해석된 workflow 브랜치: \`${RESOLVED}\`"
            echo "- 오버라이드: \`${WORKFLOW_BRANCH_OVERRIDE:-(없음 — 러너의 실제 브랜치)}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # 선언한 셀이 실제로 그 컨텍스트로 도는지 여기서 강제한다. 오버라이드가
          # 먹지 않으면 두 셀이 같은 것을 재면서 "2셀 green" 이라고 보고하게 된다.
          if [ -n "${WORKFLOW_BRANCH_OVERRIDE}" ] && [ "${RESOLVED}" != "${WORKFLOW_BRANCH_OVERRIDE}" ]; then
            echo "::error::브랜치 오버라이드가 적용되지 않았다 — 기대 ${WORKFLOW_BRANCH_OVERRIDE}, 실제 ${RESOLVED}"
            exit 1
          fi
          # v1.0.0: 통합 runner 로 단일화. runner 가 check 마다 (a) 전용 TMPDIR 을 주고
          # 종료 후 삭제하고, (b) 프로세스 그룹째 정리하며, (c) 디스크/temp 상한을 강제한다.
          # 과거 사고: temp 누수가 tmpfs 경유 OOM (RAM) / 디스크 211GB 점유를 일으켰고,
          # per-check timeout 이 부모만 죽여 손자 프로세스가 고아로 누적됐다.
          mkdir -p "${RUNNER_TEMP}/smoke-tmp"
          # `|| rc=$?` 가 필수다. GitHub 의 bash 는 `-e` 로 돌기 때문에, runner 가
          # non-zero 로 끝나면 **다음 줄인 `rc=$?` 에 닿기도 전에 스텝이 중단**된다.
          # 그래서 아래 요약 생성 블록이 실패 시에는 한 번도 실행된 적이 없었고,
          # 어떤 check 가 깨졌는지 아무 데도 남지 않았다 (v1.0.1 에서 발견).
          rc=0
          python3 workflow-source/tests/run_all_checks.py \
            --timeout=120 \
            --tmp-dir="${RUNNER_TEMP}/smoke-tmp" \
            --json > smoke-result.json || rc=$?
          # v1.0.1: 요약을 파일로 먼저 받아 **step summary 와 job 로그 양쪽**에 낸다.
          # 이전에는 step summary 로만 보냈고 stdout 은 smoke-result.json 으로
          # 리다이렉트돼 있어, 실패해도 어떤 check 인지 로그/API 어디에서도 볼 수
          # 없었다 (annotation 은 "exit code 1" 만 남는다). 무엇이 깨졌는지 볼 수
          # 없으면 아무도 고치지 않는다 — 실제로 40회 연속 red 가 방치됐다.
          python3 - "$rc" <<'PY' > smoke-summary.md
          import json, sys, pathlib
          rc = int(sys.argv[1])
          data = json.loads(pathlib.Path("smoke-result.json").read_text(encoding="utf-8"))
          failures = [r for r in data["results"] if r["exit_code"] != 0]
          aborted = data.get("aborted_reason", "")
          # **요약은 종료 코드가 보는 축을 전부 실어야 한다** (main-008).
          # 검사 실패만 싣던 동안, 저장소 write 감시가 red 를 내도 요약은
          # "Smoke Passed" 를 찍고 exit 1 만 남았다 — 무엇이 깨졌는지 볼 수 없으면
          # 아무도 고치지 않는다는 이 스크립트 자신의 교훈을 새 축이 반복했다.
          repo_write = (data.get("repo_write") or {}).get("fatal") or []
          if repo_write:
              print("## 저장소 write 감시 실패\n")
              for line in repo_write:
                  print(f"- {line}")
              print("\n범인을 좁히려면 위 `그때 돌던 검사` 들만 `--filter` 로 직렬 재실행한다.\n")
          if aborted:
              print("## Smoke ABORTED (resource guard)\n")
              print(f"- {aborted}")
              print(f"- 실행 완료: {data['total']} check (전량 아님)\n")
          if failures:
              print("## Smoke Failures\n")
              for r in failures:
                  label = "TIMEOUT" if r["last_line"] == "TIMEOUT" else f"exit {r['exit_code']}"
                  # 120자 상한은 **사유를 잘라 냈다**. 2026-08-18 run 32094513107 에서
                  # mypy 크래시 사유가 정확히 여기서 끊겨, 아티팩트를 내려받아야만
                  # 원인이 보였다 (TASK-2026-08-13-main-004 관찰 3차). step summary 는
                  # 길이 여유가 있고, 못 보는 요약은 없는 것과 같다.
                  print(f"- `{r['path']}` ({label}) — {r['error_excerpt'][:800]}")
                  # annotation 은 stderr 로 (STEP_SUMMARY 오염 방지)
                  print(f"::error file={r['path']}::smoke check failed ({label})", file=sys.stderr)
              print("\n### Local Re-run\n")
              print("```bash")
              for r in failures:
                  print(f"python3 {r['path']}")
              print("```\n")
              print("See tests/README.md for failure triage order.")
          elif not aborted and not repo_write:
              print("## Smoke Passed\n")
              print(f"- All {data['total']} `check_*.py` scripts passed "
                    f"({data['total_passed_tests']} test cases).")
          leaky = [r for r in data["results"] if r["tmp_peak_mb"] or r["killed_children"]]
          if leaky:
              print(f"\n### Resource cleanup\n")
              print(f"- {len(leaky)} check 가 temp/자식 프로세스를 남겨 runner 가 회수했습니다.")
          PY
          cat smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "----- smoke summary (job log) -----"
          cat smoke-summary.md
          exit "$rc"

      - name: Upload smoke result (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # v1.0.9: 셀마다 이름이 달라야 한다 — upload-artifact@v4 는 같은 이름의
          # 두 번째 업로드에서 실패한다(그러면 통과한 셀의 증거가 사라진다).
          name: smoke-result-${{ matrix.branch_context.label }}-py${{ matrix.python }}
          path: |
            smoke-result.json
            smoke-summary.md
          if-no-files-found: warn
          retention-days: 30
