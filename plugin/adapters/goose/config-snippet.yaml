# 생성물 — 손으로 고치지 않는다 (`python3 -m workflow_kit.plugin_payload --apply`).
# goose 설정(config.yaml)의 `extensions:` 아래에 병합한다.
# 스킬은 이 snippet 과 무관하게 goose 가 `.agents/skills/` 에서 직접 읽는다.
# 주의: goose CLI 부재 환경에서 공식 문서 스키마로 작성 — 실기 검증 미완 (계획 §3-P3).
extensions:
  standardAiWorkflowReadOnly:
    enabled: true
    type: stdio
    cmd: python3
    args:
      - "-m"
      - "workflow_kit.server.read_only_jsonrpc"
      - "--stdio-lines"
      - "--bundle"
      - "read-only"
    envs:
      STANDARD_AI_WORKFLOW_ROOT: "."
    timeout: 300
