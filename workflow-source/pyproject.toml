[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "standard-ai-workflow"
version = "1.1.5"
description = "Standard AI workflow kit — bootstrap, skills, MCP servers, templates, and examples."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "yklee", email = "ddn777@hotmail.com"},
]
keywords = [
    "ai",
    "workflow",
    "mcp",
    "code-agent",
    "harness",
    "standard-ai-workflow",
    "bootstrap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The full ``workflow-source`` distribution bundles the ``workflow_kit`` core
# library, the ``bootstrap_lib`` package, and all skills/MCP servers/templates.
# Most consumers should install this meta-package and use ``workflow_kit`` as
# the importable library name.
#
# Note: ``workflow_kit`` is shipped as part of this same distribution
# (see ``[tool.setuptools.packages]`` below), so we do NOT declare it as
# an external dependency — that would force pip to fetch it from PyPI,
# which is unnecessary for a local ``pip install -e .`` install.
dependencies = [
    "pydantic>=2.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
# MCP server transport. ``stdio-sdk`` uses the official mcp Python SDK
# (experimental). ``jsonrpc-bridge`` is the draft fixture (always available).
mcp-jsonrpc = []
mcp-sdk = [
    # 상한 해제. mcp 를 쓰는 표면은 **둘**이고 (전수 조사: `from mcp` /
    # `import mcp` / `import_module("mcp…")` / `__import__` 네 문법으로 sweep)
    # 둘 다 1.x/2.x 를 해석한다:
    #   - `mcp_v1_server.py`     — fastmcp.FastMCP ↔ mcpserver.MCPServer
    #   - `read_only_mcp_sdk.py` — lowlevel decorator ↔ add_request_handler
    # 1.27.0 / 1.28.1 / 1.29.0 / 2.0.0 에서 mypy strict + 프로토콜 왕복
    # (initialize → tools/list → tools/call) 실측. 1.x 와 2.x 의 wire 산출물이
    # tools/list·tools/call 모두 **동일**함을 확인했다.
    # 다음 major 가 또 이름을 옮기면 `check_mcp_server_sdk_compat.py` 와
    # `check_mcp_lowlevel_sdk_compat.py` 가 먼저 실패한다.
    "mcp[cli]>=1.0",
]
# v0.7.4+ Property-Based Testing (PBT) — hypothesis framework (optional)
pbt = [
    "hypothesis>=6.0",
]
# v0.7.4+ Memory Profiling — objgraph (reference chain visualization, optional)
profiling = [
    "objgraph>=3.5",
]
# Smoke test runner + linter + formatters.
# v1.0.2: mypy 를 하한 지정에서 `==2.1.0` 고정으로 바꾼다. v0.11.11 이 이미
# "CI 와 local 이 다른 mypy 를 깔면 strict 결과가 drift 하므로 핀을 통일한다" 는
# 규약을 선언했는데, 그 핀은 sub-package pyproject 에만 걸려 있었다. 정작 smoke 가
# 설치하는 것은 이 파일이고 여기는 하한만 있어 실제로는 2.3.0 이 깔렸다 — 규약이
# 아무것도 지키지 못하는 파일에 걸려 있었던 셈이다. sub-package 를 제거하면서
# 이 파일이 유일한 출처가 되므로 규약을 여기로 옮긴다.
#
# v1.0.3: `pyyaml` 추가. smoke 가 YAML 표면(워크플로우 5종 + mkdocs.yml + harness skill
# frontmatter)을 **진짜 파서**로 검사한다. 이전에는 자체 정규식 파서로 읽고 있었고,
# 그 안에서 실제로 결함이 나왔다 — raw string 의 `[^\\n]` 이 "줄바꿈 제외"가 아니라
# "역슬래시와 문자 n 제외"로 해석돼 fallback 이 전혀 동작하지 않았다.
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy==2.1.0",
    "pyyaml>=6.0",
]
# 릴리스 파이프라인이 실제로 호출하는 도구. `release_pipeline.py dist` 가
# `python -m build` 와 `python -m twine check` 를 subprocess 로 실행하는데도
# 선언돼 있지 않아, 설치 여부가 환경마다 달라 smoke 가 red/green 을 오갔다.
release = [
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/ykylee/standard_ai_workflow"
Repository = "https://github.com/ykylee/standard_ai_workflow"
Issues = "https://github.com/ykylee/standard_ai_workflow/issues"

# v1.1.1+ (TASK-2026-08-08-main-020) — CLI 化 A안: 30+ tool 을 console_script 로 노출.
# `pip install -e .` 후 30개 binary 가 자동 생성 (PATH 진입). dispatcher (B안) 는 후속.
# naming: `workflow-{kebab-case}` (e.g., `workflow-registry`, `workflow-drift-detect`).
# 기존 `python3 workflow-source/tools/X.py` 호출 경로 그대로 유지 (legacy).
[project.scripts]
# v1.1.2+ (CLI 化 B안): 단일 dispatcher. `wk <name>` 이 아래 29개 + workflow_kit_cli
#   의 38 subcommand 를 같은 이름 공간에서 부른다. 정본은
#   `workflow_kit/common/tool_dispatch.py` 의 TOOL_MODULES — 아래 목록과 갈라지면
#   `tests/check_wk_dispatcher.py` 가 red 를 낸다.
wk = "workflow_kit.workflow_kit_cli:wk_main"

workflow-apply-robust-patch = "tools.apply_robust_patch:main"
workflow-archive-branch-memory = "tools.archive_branch_memory:main"
workflow-archive-stale-memory = "tools.archive_stale_memory:main"
workflow-audit-root-anchors = "tools.audit_root_anchors:main"
workflow-check-branch-protection = "tools.check_branch_protection:main"
workflow-check-packaging = "tools.check_packaging:main"
workflow-check-quickstart-stale-links = "tools.check_quickstart_stale_links:main"
workflow-claim-workspace = "tools.claim_workspace:main"
workflow-consumer-metrics = "tools.consumer_metrics:main"
workflow-create-environment-record-stub = "tools.create_environment_record_stub:main"
workflow-detect-scope-drift = "tools.detect_scope_drift:main"
workflow-emit-wiki-l2-body = "tools.emit_wiki_l2_body:main"
workflow-fill-reverse-engineering-artifacts = "tools.fill_reverse_engineering_artifacts:main"
workflow-fix-readme-for-release = "tools.fix_readme_for_release:main"
workflow-host-pull-registry = "tools.host_pull_registry:main"
workflow-host-serve-registry = "tools.host_serve_registry:main"
workflow-install-pre-push-hook = "tools.install_pre_push_hook:main"
workflow-migrate-active-to-appendonly = "tools.migrate_active_to_appendonly:main"
workflow-migrate-legacy-l2 = "tools.migrate_legacy_l2:main"
workflow-migrate-memory-to-branch-scoped = "tools.migrate_memory_to_branch_scoped:main"
# Note: ``tools/mkdocs_git_dates.py`` 는 mkdocs plugin (on_page_markdown hook) 이지 CLI 가 아님.
#   ``mkdocs`` 가 import 시점에 plugin 으로 등록. console_script 진입점 ❌.
workflow-refresh-wiki-memory = "tools.refresh_wiki_memory:main"
workflow-release-pipeline = "tools.release_pipeline:main"
workflow-release-v0-13-0 = "tools.release_v0_13_0:main"
workflow-rotate-workflow-logs = "tools.rotate_workflow_logs:main"
workflow-score-wiki-maintainability = "tools.score_wiki_maintainability:main"
workflow-score-wiki-trend = "tools.score_wiki_trend:main"
workflow-seed-workspace-memory = "tools.seed_workspace_memory:main"
workflow-suggest-memory-entries = "tools.suggest_memory_entries:main"
workflow-survey-remote-workspaces = "tools.survey_remote_workspaces:main"
workflow-sync-release-hash = "tools.sync_release_hash:main"
workflow-wiki-emit = "tools.wiki_emit:main"
workflow-workspace-registry = "tools.workspace_registry:main"

[tool.setuptools]
# ``workflow-source`` is not a single importable package — it's a bundle of:
#   - ``workflow_kit/`` (importable, lives at workflow-source/workflow_kit/)
#   - ``scripts/bootstrap_lib/`` (importable, lives at workflow-source/scripts/bootstrap_lib/)
#   - ``tools/`` (v1.1.1+ importable — CLI 化 A안, [project.scripts] entry points)
#   - skills/, mcp_servers/, templates/, examples/, etc. (non-code assets)
#
# For a full install we only need the importable sub-packages on
# ``sys.path``. The rest is consumed via the repo's directory layout
# (or copied into the consumer's project by the bootstrap script).
packages = [
    "bootstrap_lib",
    "bootstrap_lib.harnesses",
    "workflow_kit",
    "workflow_kit.common",
    "workflow_kit.common.modes",
    "workflow_kit.common.state",
    "workflow_kit.common.contracts",
    "workflow_kit.common.schemas",
    "workflow_kit.contract_v1",
    "workflow_kit.server",
    "workflow_kit.harness",
    "tools",  # v1.1.1+ — CLI 化 A안: 30+ console_script entry points
]

# Single-file modules that don't live inside a package directory.
# ``bootstrap_workflow_kit`` is the legacy CLI shim kept for back-compat
# (see scripts/bootstrap_workflow_kit.py docstring) and ships as a
# top-level module from ``scripts/``.
py-modules = ["bootstrap_workflow_kit"]

[tool.setuptools.package-dir]
# Map package names to their on-disk locations. This lets us ship
# ``workflow_kit``, ``bootstrap_lib``, and ``tools`` from the same distribution
# even though they live in different subdirectories of the repo.
"workflow_kit" = "workflow_kit"
"workflow_kit.common" = "workflow_kit/common"
"workflow_kit.common.modes" = "workflow_kit/common/modes"
"workflow_kit.common.state" = "workflow_kit/common/state"
"workflow_kit.common.contracts" = "workflow_kit/common/contracts"
"workflow_kit.common.schemas" = "workflow_kit/common/schemas"
"workflow_kit.server" = "workflow_kit/server"
"workflow_kit.harness" = "workflow_kit/harness"
"bootstrap_lib" = "scripts/bootstrap_lib"
"bootstrap_lib.harnesses" = "scripts/bootstrap_lib/harnesses"
"tools" = "tools"  # v1.1.1+ — CLI 化 A안: 30+ console_script 의 source

[tool.setuptools.package-data]
workflow_kit = ["README.md", "py.typed"]
bootstrap_lib = ["py.typed"]
tools = ["hooks/pre-push-no-force.sh"]  # v1.1.1+ — pre-push hook script 도 패키지에 포함

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
# v0.8.0+ — strict = true.
# 단계적 격상 (workflow-source/core/v0_8_0_stable_api_spec.md §5.3):
# - v0.8.0: workflow_kit/__init__.py 의 public surface 만 strict clean (이 file 자체).
#   다른 module 은 pyproject.toml [tool.mypy.overrides] 로 module 별 strict 분할.
# - v0.8.x follow-up: workflow_kit/<module>.py 의 strict clean 단계적 격상.
# - v0.9.0: full strict (모든 module strict clean).
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
# v0.9.0+: skills/* 는 non-Python (skill spec markdown + helper script) 디렉터리.
# hyphen-named subpackage (e.g. "git-conflict-resolver") 가 mypy 의 package validation
# 을 trigger 하므로 exclude. workflow_kit / tools / tests 만 mypy strict 대상.
#
# v1.0.2: **anchor 추가.** 이전 값 `["schemas/.*", ...]` 는 anchor 가 없어 경로
# *어디서든* 매치했다 — 의도한 대상은 `workflow-source/schemas/` 였는데
# `workflow_kit/common/schemas/` 의 **실소스 20 file 까지 같이 잘라내고 있었다**
# (117 → 97). exclude 는 crawl 대상에서 조용히 빼므로 줄어든 사실이 어디에도 안 보인다.
#
# mypy 의 exclude 는 config 파일 위치가 아니라 **cwd 기준 경로**에 re.search 로 매치되므로
# cwd 마다 형태가 다르다. 두 가지 실행 위치를 모두 명시한다:
#   - REPO_ROOT   : CI / release gate / smoke 의 실제 invocation
#   - workflow-source : 로컬에서 `cd workflow-source && mypy workflow_kit/`
# 두 패턴 모두 디렉터리 경계에 anchor 돼 있어 `workflow_kit/` 내부와는 절대 겹치지 않는다.
exclude = [
    "(?:^|/)workflow-source/(?:skills|prompts|examples|schemas|core|build|releases|scripts)/",
    "^(?:skills|prompts|examples|schemas|core|build|releases|scripts)/",
]
# v0.8.0+ 단계적 strict 격상 — non-public-surface module 은 v0.8.x~0.9.0 에서 단계적 격상.
# 현재 v0.8.0 은 workflow_kit/__init__.py 의 public API 만 strict clean.
# 다른 module 은 `disallow_untyped_defs = false` (v0.8.x follow-up) 로 두고, base strict = true 가
# *unused-ignore* 등 정합성 lint 만 enforce.
# (overrides 는 v0.8.x follow-up 에서 module 별 추가)
# v0.8.0 follow-up: workflow_kit/{url_validity,okf_import,okf_export,phishing_*,cache_*}.py
# 의 annotation 보강, v0.9.0 에서 full strict.

# ---------------------------------------------------------------------------
# v0.7.6+ workflow-doctor external config
# ---------------------------------------------------------------------------
#
# workflow_kit.common.metadata.load_config() 가 이 section 을 읽어 DoctorConfig 반환.
# v0.8.0+ 단계적 strict 격상 — non-public-surface module 은 v0.8.x~0.9.0 에서 단계적 격상.
# v0.8.0: workflow_kit/__init__.py 만 strict clean (public surface).
# v0.8.1: + workflow_kit/url_validity.py (V-R10, 25 error → 0, v0.8.0 spec §5.3 단계 1).
# v0.8.2+: url_validity.py 다음 module 별 strict 격상, 작은 release 로 분할.
# v0.9.0: full strict (모든 module strict clean).
# module 별 strict 격상 시 [tool.mypy.overrides] 로 enable 하는 것이 아니라,
# v0.8.1 처럼 base strict = true + module 별 error fix.
# 의 partial_rules 인자로 전달. 해당 rule 의 non_compliant 는 hard fail (CI fail).
[tool.workflow-doctor]
# v0.7.6 default: resiliency 의 RES-WF-01/02 (변경 관리 + critical workload 식별).
#
# v1.1.4 에서 잠시 testing partial(TST-WF-01 선언 예외)이 있었다 — 당시 측정
# (`^def test_/case_` 이름 count)이 inline `check()` / `failures.append` 관행을 못 봐
# 만성 red 였기 때문. v1.1.5 에서 측정을 AST verification-signal 기반으로 재설계해
# (baselines._count_verification_signals, dummy `assert True` 는 세지 않음) 예외를
# 제거했다. TST-WF-01 은 다시 hard constraint 다.
partial_rules = { resiliency = ["RES-WF-01", "RES-WF-02"] }

# baseline 별 opt-in rule dict. opt-in rule 은 default disable, 명시적 enable 시에만
# evaluate 대상. (v0.7.6 시점: security-auth 의 2FA 는 opt-in 권장, default disable)
opt_in = { "security-auth" = ["SEC-AUTH-04"] }

# dim 별 alert threshold
# - score_alert: 0.0~1.0, score trend 의 dim 별 alert 시 사용 (tools/score_wiki_trend.py)
# - memory_alert_mb: profiling baseline 의 leak/regression alert 시 사용
thresholds = { score_alert = 0.3, memory_alert_mb = 100.0 }

# lint / score 측정 시 skip 할 path glob (build / venv / cache / wiki mirror)
excluded_paths = ["build/*", ".venv/*", ".venv-build/*", "__pycache__/*", ".worktrees/*"]

# CI integration — evaluate_compliance 결과 status 가 이 값 이상이면 exit 1.
# "compliant" | "advisory" | "non_compliant". default: "non_compliant".
fail_on = "non_compliant"
